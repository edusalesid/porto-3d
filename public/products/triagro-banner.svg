<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tri-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111513"/>
      <stop offset="100%" stop-color="#161b17"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#tri-bg)"/>
  
  <rect x="24" y="24" width="912" height="432" rx="12" fill="#151916" stroke="#222b24" stroke-width="1.5"/>

  <!-- Top bar -->
  <path d="M 24 36 Q 24 24 36 24 L 924 24 Q 936 24 936 36 L 936 68 L 24 68 Z" fill="#19201a"/>
  <circle cx="48" cy="46" r="5" fill="#e76b6b" opacity="0.8"/>
  <circle cx="64" cy="46" r="5" fill="#e5b84b" opacity="0.8"/>
  <circle cx="80" cy="46" r="5" fill="#46c98a" opacity="0.8"/>
  <text x="110" y="50" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e8e8e9">TriAgro Supply · First-Mile Agricultural Lot Traceability &amp; Logistics</text>
  
  <rect x="730" y="36" width="180" height="22" rx="11" fill="rgba(70,201,138,0.15)" stroke="#46c98a" stroke-width="0.8"/>
  <circle cx="744" cy="47" r="3.5" fill="#46c98a"/>
  <text x="756" y="51" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#46c98a">Traceability: 100% Batches</text>

  <!-- Left Sidebar: Active Harvest Batches -->
  <rect x="24" y="68" width="260" height="388" fill="#131714" stroke="#1f2620" stroke-width="1"/>
  <text x="44" y="98" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#77787c" letter-spacing="0.04em">HARVEST INTAKE QUEUE</text>

  <rect x="36" y="112" width="236" height="60" rx="8" fill="#1b231c" stroke="#2d3a2f" stroke-width="1"/>
  <text x="48" y="134" font-family="monospace" font-size="11" font-weight="700" fill="#46c98a">LOT-PALM-2026-049</text>
  <text x="48" y="152" font-family="Inter, sans-serif" font-size="11" fill="#e8e8e9">Estate: Riau Block 4B · 14.8 MT</text>
  <text x="48" y="166" font-family="monospace" font-size="9.5" fill="#e5b84b">Truck B 9128 UZ · In Transit (GPS OK)</text>

  <rect x="36" y="182" width="236" height="60" rx="8" fill="#161b17" stroke="#212a23" stroke-width="1"/>
  <text x="48" y="204" font-family="monospace" font-size="11" font-weight="700" fill="#e8e8e9">LOT-COFFEE-2026-118</text>
  <text x="48" y="222" font-family="Inter, sans-serif" font-size="11" fill="#a7a7aa">Estate: Gayo Highland · 4.2 MT</text>
  <text x="48" y="236" font-family="monospace" font-size="9.5" fill="#46c98a">Weighbridge Cleared · Zero Leakage</text>

  <!-- Center: Checkpoint Verification Flow -->
  <rect x="284" y="68" width="652" height="388" fill="#151916"/>
  <text x="312" y="104" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#e8e8e9">Real-Time Weighbridge &amp; Quality Reconciliation</text>
  <text x="312" y="124" font-family="Inter, sans-serif" font-size="11" fill="#77787c">Digital barcode intake eliminating paper manifest discrepancies between estate scales and central mill.</text>

  <!-- 3 Checkpoints horizontal pipeline -->
  <rect x="312" y="146" width="180" height="120" rx="8" fill="#1b211d" stroke="#29342c" stroke-width="1"/>
  <text x="328" y="172" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#46c98a">1. Field Intake Tag</text>
  <text x="328" y="194" font-family="monospace" font-size="10.5" fill="#a7a7aa">QR / Barcode Scanned</text>
  <text x="328" y="210" font-family="monospace" font-size="10.5" fill="#a7a7aa">Weight: 14,820 kg</text>
  <text x="328" y="246" font-family="Inter, sans-serif" font-size="10" fill="#77787c">Timestamp: 06:14 WIB</text>

  <rect x="512" y="146" width="180" height="120" rx="8" fill="#1b211d" stroke="#29342c" stroke-width="1"/>
  <text x="528" y="172" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#46c98a">2. Truck Manifest</text>
  <text x="528" y="194" font-family="monospace" font-size="10.5" fill="#a7a7aa">Driver: Supriyadi</text>
  <text x="528" y="210" font-family="monospace" font-size="10.5" fill="#a7a7aa">Tamper Seal: Verified</text>
  <text x="528" y="246" font-family="Inter, sans-serif" font-size="10" fill="#77787c">Geo-fencing: Compliant</text>

  <rect x="712" y="146" width="180" height="120" rx="8" fill="#1b211d" stroke="#46c98a" stroke-width="1.5"/>
  <text x="728" y="172" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f5d400">3. Mill Weighbridge</text>
  <text x="728" y="194" font-family="monospace" font-size="10.5" fill="#46c98a">Gross: 24,180 kg</text>
  <text x="728" y="210" font-family="monospace" font-size="10.5" fill="#46c98a">Tare: 9,370 kg</text>
  <text x="728" y="246" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#46c98a">Variance: -0.06% (Pass)</text>

  <!-- Impact Metric Card -->
  <rect x="312" y="286" width="580" height="120" rx="8" fill="#18201a" stroke="#28352b" stroke-width="1"/>
  <text x="330" y="316" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e8e8e9">Operational Impact &amp; Shrinkage Control</text>
  <text x="330" y="338" font-family="Inter, sans-serif" font-size="11" fill="#a7a7aa">Replaced 32-page physical triplicate manifests with instant offline sync on rugged handhelds.</text>
  <text x="330" y="358" font-family="monospace" font-size="11" font-weight="600" fill="#46c98a">✓ Discrepancy rate dropped from 4.2% to 0.08% within first 60 days of field deployment.</text>
</svg>