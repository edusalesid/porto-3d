<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="oee-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gauge-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gauge-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gauge-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#oee-bg)"/>

  <!-- Subtle industrial grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="260" x2="960" y2="260"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
  </g>

  <!-- Window Frame -->
  <rect x="24" y="24" width="912" height="432" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 24 38 Q 24 24 38 24 L 922 24 Q 936 24 936 38 L 936 74 L 24 74 Z" fill="#1e293b"/>
  <circle cx="48" cy="49" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="66" cy="49" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="84" cy="49" r="5" fill="#10b981" opacity="0.85"/>

  <text x="110" y="53" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
    OEE Monitoring System · Real-Time Manufacturing Intelligence
  </text>

  <!-- Live Simulation Button -->
  <rect x="580" y="38" width="135" height="24" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <text x="596" y="54" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">▶ Mulai Simulasi</text>

  <rect x="730" y="38" width="186" height="24" rx="12" fill="rgba(37,99,235,0.15)" stroke="#3b82f6" stroke-width="0.8"/>
  <circle cx="744" cy="50" r="3.5" fill="#10b981"/>
  <text x="754" y="54" font-family="monospace" font-size="10.5" font-weight="600" fill="#38bdf8">dashboard-oee.riizalhp.web.id</text>

  <!-- Machine Info & Status Row -->
  <rect x="40" y="88" width="360" height="66" rx="8" fill="#141f36" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="110" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">MACHINE INFORMATION</text>
  <text x="56" y="134" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Line 01 · Primary Stamping Press</text>
  <text x="56" y="147" font-family="monospace" font-size="9.5" fill="#38bdf8">Shift: 1 (Morning) · Cycle: 4.5s</text>

  <!-- Status Machine Pill -->
  <rect x="414" y="88" width="180" height="66" rx="8" fill="#141f36" stroke="#1e293b" stroke-width="1"/>
  <text x="430" y="110" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">MACHINE STATUS</text>
  <rect x="430" y="118" width="70" height="24" rx="4" fill="#065f46"/>
  <text x="448" y="134" font-family="monospace" font-size="12" font-weight="800" fill="#34d399">RUN</text>

  <!-- Trouble Info -->
  <rect x="608" y="88" width="308" height="66" rx="8" fill="#141f36" stroke="#1e293b" stroke-width="1"/>
  <text x="624" y="110" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">TROUBLE INFORMATION</text>
  <text x="624" y="135" font-family="monospace" font-size="13" font-weight="600" fill="#10b981">NORMAL · NO ALARM ACTIVE</text>

  <!-- 4 Gauges Row -->
  <!-- Gauge 1: Availability -->
  <rect x="40" y="168" width="202" height="135" rx="8" fill="#141f36" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="190" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">AVAILABILITY</text>
  <!-- Arc representation -->
  <path d="M 66 265 A 50 50 0 0 1 176 265" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <path d="M 66 265 A 50 50 0 0 1 168 230" fill="none" stroke="url(#gauge-cyan)" stroke-width="14" stroke-linecap="round"/>
  <text x="121" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">92.4%</text>
  <text x="121" y="292" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Loading: 460 min</text>

  <!-- Gauge 2: Performance -->
  <rect x="256" y="168" width="202" height="135" rx="8" fill="#141f36" stroke="#1e293b" stroke-width="1"/>
  <text x="272" y="190" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">PERFORMANCE</text>
  <path d="M 282 265 A 50 50 0 0 1 392 265" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <path d="M 282 265 A 50 50 0 0 1 382 240" fill="none" stroke="url(#gauge-green)" stroke-width="14" stroke-linecap="round"/>
  <text x="337" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#34d399">88.6%</text>
  <text x="337" y="292" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Speed Loss: 4.2%</text>

  <!-- Gauge 3: Quality -->
  <rect x="472" y="168" width="202" height="135" rx="8" fill="#141f36" stroke="#1e293b" stroke-width="1"/>
  <text x="488" y="190" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">QUALITY</text>
  <path d="M 498 265 A 50 50 0 0 1 608 265" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <path d="M 498 265 A 50 50 0 0 1 606 260" fill="none" stroke="url(#gauge-cyan)" stroke-width="14" stroke-linecap="round"/>
  <text x="553" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">99.1%</text>
  <text x="553" y="292" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Defect: 0.9%</text>

  <!-- Gauge 4: Total OEE -->
  <rect x="688" y="168" width="228" height="135" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1.5"/>
  <text x="704" y="190" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#60a5fa">TOTAL OEE SCORE</text>
  <path d="M 724 265 A 56 56 0 0 1 848 265" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
  <path d="M 724 265 A 56 56 0 0 1 836 235" fill="none" stroke="url(#gauge-green)" stroke-width="16" stroke-linecap="round"/>
  <text x="786" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="900" fill="#60a5fa">81.1%</text>
  <text x="786" y="292" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">WORLD CLASS TARGET</text>

  <!-- Lower Section: Stop Category & Output Timing -->
  <rect x="40" y="315" width="418" height="125" rx="8" fill="#141f36" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="337" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SUMMARY STOP CATEGORY (DOWNTIME)</text>
  
  <rect x="56" y="352" width="80" height="22" rx="4" fill="#1e293b"/>
  <text x="64" y="367" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Breakdown</text>
  <text x="146" y="367" font-family="monospace" font-size="10" font-weight="600" fill="#ef4444">0.0 min</text>

  <rect x="56" y="380" width="80" height="22" rx="4" fill="#1e293b"/>
  <text x="64" y="395" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Startup</text>
  <text x="146" y="395" font-family="monospace" font-size="10" font-weight="600" fill="#f59e0b">12.5 min</text>

  <rect x="56" y="408" width="80" height="22" rx="4" fill="#1e293b"/>
  <text x="64" y="423" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Tool Change</text>
  <text x="146" y="423" font-family="monospace" font-size="10" font-weight="600" fill="#38bdf8">8.0 min</text>

  <!-- Mini bar chart -->
  <g transform="translate(230, 350)">
    <rect x="0" y="55" width="28" height="15" rx="3" fill="#ef4444"/>
    <rect x="40" y="20" width="28" height="50" rx="3" fill="#f59e0b"/>
    <rect x="80" y="35" width="28" height="35" rx="3" fill="#38bdf8"/>
    <rect x="120" y="5" width="28" height="65" rx="3" fill="#10b981"/>
    <text x="14" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#64748b">BD</text>
    <text x="54" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#64748b">SU</text>
    <text x="94" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#64748b">TC</text>
    <text x="134" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#64748b">OT</text>
  </g>

  <!-- Output Timing table preview -->
  <rect x="472" y="315" width="444" height="125" rx="8" fill="#141f36" stroke="#1e293b" stroke-width="1"/>
  <text x="488" y="337" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SUMMARY OUTPUT &amp; SPEED LOSS</text>
  
  <rect x="488" y="350" width="412" height="24" rx="4" fill="#1e293b"/>
  <text x="500" y="366" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8">PART TYPE</text>
  <text x="620" y="366" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8">CYCLE</text>
  <text x="710" y="366" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8">QTY TOTAL</text>
  <text x="820" y="366" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8">SPEED LOSS</text>

  <text x="500" y="392" font-family="monospace" font-size="10.5" fill="#e2e8f0">Bracket Sub-Assy</text>
  <text x="620" y="392" font-family="monospace" font-size="10.5" fill="#38bdf8">4.50s</text>
  <text x="710" y="392" font-family="monospace" font-size="10.5" fill="#10b981">5,820 pcs</text>
  <text x="820" y="392" font-family="monospace" font-size="10.5" fill="#f59e0b">-1.8%</text>

  <text x="500" y="420" font-family="monospace" font-size="10.5" fill="#e2e8f0">Flange Plate Gen-2</text>
  <text x="620" y="420" font-family="monospace" font-size="10.5" fill="#38bdf8">6.20s</text>
  <text x="710" y="420" font-family="monospace" font-size="10.5" fill="#10b981">3,450 pcs</text>
  <text x="820" y="420" font-family="monospace" font-size="10.5" fill="#10b981">0.0%</text>
</svg>
