  <text x="680" y="294" font-family="Inter, sans-serif" font-size="11" fill="#77787c">Service (5%) + Tax (10%)</text>
  <text x="872" y="294" font-family="monospace" font-size="11" fill="#a7a7aa">24.000</text>
  <text x="680" y="322" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#e8e8e9">Total Bill</text>
  <text x="846" y="322" font-family="monospace" font-size="14" font-weight="700" fill="#f5d400">Rp 184.000</text>

