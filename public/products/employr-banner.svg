<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="emp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emp-navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f3578"/>
      <stop offset="100%" stop-color="#3b5cc4"/>
    </linearGradient>
    <linearGradient id="emp-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#emp-bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="380" x2="960" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="650" y1="0" x2="650" y2="480"/>
  </g>

  <!-- Window Frame -->
  <rect x="24" y="24" width="912" height="432" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <path d="M 24 38 Q 24 24 38 24 L 922 24 Q 936 24 936 38 L 936 74 L 24 74 Z" fill="#131e36"/>
  <circle cx="48" cy="49" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="66" cy="49" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="84" cy="49" r="5" fill="#10b981" opacity="0.85"/>

  <text x="110" y="53" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
    Employr · Career Workspace &amp; ATS CV Builder Platform
  </text>

  <rect x="580" y="38" width="135" height="24" rx="12" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="0.8"/>
  <circle cx="594" cy="50" r="3.5" fill="#22c55e"/>
  <text x="604" y="54" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#4ade80">Lifetime Member</text>

  <rect x="730" y="38" width="186" height="24" rx="12" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="752" y="54" font-family="monospace" font-size="11" font-weight="700" fill="#f97316">https://employr.id</text>

  <!-- Left: ATS CV Document Preview -->
  <rect x="40" y="90" width="310" height="350" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="116" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">CV Builder Ramah ATS</text>
  <text x="56" y="132" font-family="monospace" font-size="9.5" fill="#38bdf8">Client-Side Print PDF · JSON State</text>

  <!-- Resume Sheet Preview -->
  <g transform="translate(56, 145)">
    <rect x="0" y="0" width="278" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Simulated CV lines -->
    <rect x="16" y="14" width="140" height="10" rx="2" fill="#1f3578"/>
    <rect x="16" y="28" width="180" height="6" rx="2" fill="#64748b"/>
    <line x1="16" y1="42" x2="262" y2="42" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Section: Experience -->
    <rect x="16" y="50" width="80" height="7" rx="2" fill="#1f3578"/>
    <rect x="16" y="62" width="220" height="5" rx="2" fill="#475569"/>
    <rect x="16" y="72" width="240" height="4" rx="2" fill="#94a3b8"/>
    <rect x="16" y="80" width="230" height="4" rx="2" fill="#94a3b8"/>

    <!-- Section: Education -->
    <rect x="16" y="94" width="70" height="7" rx="2" fill="#1f3578"/>
    <rect x="16" y="106" width="200" height="5" rx="2" fill="#475569"/>
    <rect x="16" y="116" width="210" height="4" rx="2" fill="#94a3b8"/>

    <!-- Section: Skills -->
    <rect x="16" y="130" width="60" height="7" rx="2" fill="#1f3578"/>
    <rect x="16" y="142" width="55" height="14" rx="3" fill="#e2e8f0"/>
    <rect x="76" y="142" width="65" height="14" rx="3" fill="#e2e8f0"/>
    <rect x="146" y="142" width="55" height="14" rx="3" fill="#e2e8f0"/>
    <rect x="206" y="142" width="50" height="14" rx="3" fill="#e2e8f0"/>

    <text x="139" y="174" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#059669">
      ✓ ATS Score: 96/100 (Verified)
    </text>
  </g>

  <!-- CTA Download / Print Button -->
  <rect x="56" y="345" width="278" height="42" rx="8" fill="url(#emp-orange)"/>
  <text x="195" y="371" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    Cetak CV ATS (PDF Instan)
  </text>

  <!-- Right: Job Application Tracker & Career Pipeline -->
  <rect x="370" y="90" width="550" height="350" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1"/>
  <text x="390" y="116" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Job Application Tracker (Unlimited)</text>
  <text x="390" y="132" font-family="monospace" font-size="9.5" fill="#f97316">Kanban Pipeline · Tanpa Batas Kuota</text>

  <!-- 3 Kanban Columns -->
  <g transform="translate(390, 145)">
    <!-- Col 1: Terkirim -->
    <rect x="0" y="0" width="160" height="235" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">TERKIRIM (8)</text>
    
    <rect x="10" y="36" width="140" height="58" rx="6" fill="#0f172a"/>
    <text x="18" y="54" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Frontend Dev</text>
    <text x="18" y="68" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">PT Tech Nusantara</text>
    <text x="18" y="82" font-family="monospace" font-size="8.5" fill="#38bdf8">Kirim: 28 Okt</text>

    <rect x="10" y="102" width="140" height="58" rx="6" fill="#0f172a"/>
    <text x="18" y="120" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Admin Operasional</text>
    <text x="18" y="134" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Logistik Jaya</text>
    <text x="18" y="148" font-family="monospace" font-size="8.5" fill="#38bdf8">Kirim: 26 Okt</text>

    <!-- Col 2: Interview -->
    <rect x="175" y="0" width="160" height="235" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="189" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#f5d400">INTERVIEW (3)</text>
    
    <rect x="185" y="36" width="140" height="68" rx="6" fill="#0f172a" stroke="#f5d400" stroke-width="0.8"/>
    <text x="193" y="54" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">IT Project Lead</text>
    <text x="193" y="68" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Digital Solusindo</text>
    <text x="193" y="82" font-family="monospace" font-size="8.5" fill="#f5d400">Tahap: User Interview</text>
    <text x="193" y="94" font-family="Inter, sans-serif" font-size="8" fill="#10b981">Jumat, 14:00 WIB</text>

    <!-- Col 3: Diterima -->
    <rect x="350" y="0" width="160" height="235" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="364" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#10b981">OFFERING (2)</text>
    
    <rect x="360" y="36" width="140" height="64" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
    <text x="368" y="54" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Technical Lead</text>
    <text x="368" y="68" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Fintech Indo Corp</text>
    <text x="368" y="86" font-family="monospace" font-size="9" font-weight="700" fill="#10b981">Offering Letter Signed</text>
  </g>
</svg>
